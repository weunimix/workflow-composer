name: 编译验证

on:
  push:
    paths:
      - 'lib/**'
      - 'agents/**'
      - 'workflows/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'agents.config.ts'
  pull_request:
    paths:
      - 'lib/**'
      - 'agents/**'
      - 'workflows/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'agents.config.ts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 编译产物
        run: npm run build